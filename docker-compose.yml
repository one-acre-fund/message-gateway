version: "3.7"

services:

  message-gateway:
    build:
      context: .
    image: ${IMAGE_REGISTRY}${IMAGE_REPOSITORY:-oneacrefund/message-gateway}:${IMAGE_TAG:-local}
    ports:
      - 9191:9191
    environment:
      - LOGGING_LEVEL_ROOT=INFO
      - SPRING_DATASOURCE_URL=jdbc:mysql:thin://operationsmysql:3306/messagegateway
      - CALLBACKCONFIG_HOST=
      - HOSTCONFIG_HOST=
      - MYSQL_PASSWORD=
      - MYSQL_USERNAME=
      - PROVIDERKEYS_TELERIVETAPIKEY=
      - PROVIDERKEYS_TELERIVETPROJECTID=
      - PROVIDERSOURCE_FROMDATABASE=disabled
      - PROVIDERSOURCE_FROMYML=enabled
